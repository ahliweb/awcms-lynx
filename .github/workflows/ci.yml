# CI for awcms-lynx. The `check` job mirrors `bun run check` (lint, typecheck,
# tests, UI tests, build) and adds the desktop build plus the bundle artifact.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The Lynx toolchain (Rspeedy, Rstest, Lynxtron) runs under Node; see ADR-0002.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:ui
      - run: bun run build
      - run: bun run build:desktop
        continue-on-error: false

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            apps/mobile/dist/*.bundle
            apps/web/dist
          retention-days: 7
          if-no-files-found: error
