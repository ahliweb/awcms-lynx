# CI for awcms-lynx. The `check` job mirrors `bun run check` (lint, typecheck,
# tests, UI tests, build) and adds the desktop build plus the bundle artifact.
# The `android` job builds the Android host project (hosts/android, ADR-0006); its
# third-party actions are pinned by commit SHA (the tag is in the trailing comment).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The Lynx toolchain (Rspeedy, Rstest, Lynxtron) runs under Node; see ADR-0002.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:ui
      - run: bun run build
      - run: bun run build:desktop
        continue-on-error: false

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            apps/mobile/dist/*.bundle
            apps/web/dist
          retention-days: 7
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21' # Gradle/AGP run on 21; the code targets Java 17 (ADR-0006)

      # Refuses a gradle-wrapper.jar that is not an official Gradle release.
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The runner image provides the Android SDK (ANDROID_HOME); AGP 8.9.1 uses
      # compileSdk 36 and build-tools 36.0.0 from it (installing them if absent).
      - run: bun install --frozen-lockfile
      - run: bun run build:mobile

      - name: Build debug APK, lint, JVM tests (contract vectors)
        working-directory: hosts/android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest

      - name: Assert the bundle is inside the debug APK
        working-directory: hosts/android
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q ' assets/main.lynx.bundle$'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reports
          path: |
            hosts/android/app/build/reports/lint-results-debug.html
            hosts/android/app/build/test-results/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore
